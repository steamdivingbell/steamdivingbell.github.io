name: Scrape game data
on:
  # Hopefully just as a backup in case there's a critical infra failure.
  schedule:
    - cron: '42 3 * * *' # Runs at 3:42, once per day.
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  id-token: write
  pages: write

jobs:
  run:
    runs-on: ubuntu-latest
    # Only run one scraping task at once, to prevent redundant scraping.
    concurrency:
      group: scrape
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@main
    - uses: actions/checkout@main
      with:
        repository: steamdivingbell/divingbell-data
        ref: main
        path: data/app_details
        fetch-depth: 1
        token: ${{ secrets.DIVINGBELL_DATA_TOKEN }} # This repo is private. This will also allow us to push to it.
    - uses: actions/setup-python@main
      with:
        python-version: '3.x'
    - run: pip install -r data/requirements.txt
    - run: python -u scraper.py
      working-directory: data
      timeout-minutes: 120
      env:
        STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
    - run: python -u push_changes.py
      if: ${{ always() }}
      working-directory: data
    # The github cron triggers are not working consistently, but it's not a VM capacity issue (somehow).
    # Instead, just requeue this task at the end, and the concurrency group will wait for the current run before starting it.
    # If github's infra goes down, I can restart the loop by manual trigger (probably).
    - run: gh workflow run scrape_data.yml --ref ${{ github.ref_name }}
      if: ${{ always() }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}

  deploy:
    runs-on: ubuntu-latest
    needs: run

    steps:
    - uses: actions/checkout@main
    - uses: actions/checkout@main
      with:
        repository: steamdivingbell/divingbell-data
        ref: main
        path: data/app_details
        fetch-depth: 1
        token: ${{ secrets.DIVINGBELL_DATA_TOKEN }} # This repo is private. This will also allow us to push to it.
    - uses: actions/upload-pages-artifact@main
      with:
        path: .
    - uses: actions/deploy-pages@main
      continue-on-error: true # This deployment fails some times because it's very large.
      with:
        timeout: 600000 # 10 minutes (maximum allowed by github)
