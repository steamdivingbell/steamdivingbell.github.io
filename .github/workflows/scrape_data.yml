name: Scrape game data
on:
  # Disabled due to inconsistencies in the github triggering.
  # schedule:
  #  - cron: '42 * * * *' # Runs 42 minutes past the hour, every hour
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  id-token: write
  pages: write

# Delay each task until the next one, so that the requeued task doesn't stomp on this one.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main
    - uses: actions/checkout@main
      with:
        repository: steamdivingbell/divingbell-data
        ref: main
        path: data/app_details
        fetch-depth: 1
        token: ${{ secrets.DIVINGBELL_DATA_TOKEN }} # This repo is private. This will also allow us to push to it.
    - uses: actions/setup-python@main
      with:
        python-version: '3.x'
    - run: pip install -r data/requirements.txt
    - run: python -u scraper.py
      working-directory: data
      timeout-minutes: 120
      env:
        STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
    - name: Commit game data
      if: ${{ always() }}
      run: python -u push_changes.py
      working-directory: data
    - uses: actions/upload-pages-artifact@main
      with:
        path: .
    - uses: actions/deploy-pages@main

    # The github cron triggers are not working consistently, but it's not a VM capacity issue (somehow).
    # Instead, just requeue this task at the end, and the concurrency group will wait for the current run before starting it.
    # If github's infra goes down, I can restart the loop by manual trigger (probably).
    - name: Requeue CI
      run: gh workflow run scrape_data.yml --ref ${{ github.ref_name }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
